<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1A18"/>
      <stop offset="100%" stop-color="#0F1A0D"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A8D89E"/>
      <stop offset="100%" stop-color="#4E7A44"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A8D89E"/>
      <stop offset="50%" stop-color="#4E7A44"/>
      <stop offset="100%" stop-color="#D4883A"/>
    </linearGradient>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="tinyblur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="rounded">
      <rect width="900" height="280" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Background -->
    <rect width="900" height="280" fill="url(#bg)"/>

    <!-- Grid lines -->
    <g opacity="0.025" stroke="white" stroke-width="1">
      <line x1="0" y1="70" x2="900" y2="70"/>
      <line x1="0" y1="140" x2="900" y2="140"/>
      <line x1="0" y1="210" x2="900" y2="210"/>
      <line x1="112" y1="0" x2="112" y2="280"/>
      <line x1="225" y1="0" x2="225" y2="280"/>
      <line x1="337" y1="0" x2="337" y2="280"/>
      <line x1="450" y1="0" x2="450" y2="280"/>
      <line x1="562" y1="0" x2="562" y2="280"/>
      <line x1="675" y1="0" x2="675" y2="280"/>
      <line x1="787" y1="0" x2="787" y2="280"/>
    </g>

    <!-- Mesh blobs -->
    <circle cx="730" cy="70"  r="110" fill="#4E7A44" opacity="0.16" filter="url(#softblur)"/>
    <circle cx="120" cy="210" r="90"  fill="#D4883A" opacity="0.09" filter="url(#softblur)"/>
    <circle cx="460" cy="30"  r="70"  fill="#3A7A74" opacity="0.08" filter="url(#softblur)"/>
    <circle cx="820" cy="240" r="60"  fill="#8ABD80" opacity="0.07" filter="url(#softblur)"/>

    <!-- Leaf decoration  top right -->
    <g transform="translate(836, 42) rotate(-25)" opacity="0.18">
      <ellipse cx="0" cy="0" rx="22" ry="38" fill="#8ABD80"/>
      <line x1="0" y1="36" x2="0" y2="-28" stroke="#4E7A44" stroke-width="1.4" opacity="0.7"/>
      <line x1="0" y1="14" x2="-10" y2="4"  stroke="#4E7A44" stroke-width="0.9" opacity="0.4"/>
      <line x1="0" y1="14" x2="10"  y2="4"  stroke="#4E7A44" stroke-width="0.9" opacity="0.4"/>
    </g>

    <!-- Leaf decoration  bottom left -->
    <g transform="translate(58, 248) rotate(18)" opacity="0.13">
      <ellipse cx="0" cy="0" rx="16" ry="28" fill="#8ABD80"/>
      <line x1="0" y1="26" x2="0" y2="-20" stroke="#4E7A44" stroke-width="1.2" opacity="0.6"/>
    </g>

    <!-- Small leaf scatter -->
    <g transform="translate(200, 56) rotate(-10)" opacity="0.07">
      <ellipse cx="0" cy="0" rx="9" ry="16" fill="#8ABD80"/>
      <line x1="0" y1="14" x2="0" y2="-10" stroke="#4E7A44" stroke-width="1" opacity="0.6"/>
    </g>
    <g transform="translate(680, 240) rotate(35)" opacity="0.08">
      <ellipse cx="0" cy="0" rx="10" ry="18" fill="#8ABD80"/>
    </g>

    <!-- Eyebrow line + label -->
    <line x1="350" y1="84" x2="374" y2="84" stroke="#8ABD80" stroke-width="1.5" opacity="0.8"/>
    <text x="382" y="89" font-family="'Arial', sans-serif" font-size="10.5" fill="#8ABD80"
          letter-spacing="3.5" font-weight="600" opacity="0.9">A NEW KIND OF SOCIAL</text>

    <!-- Main title -->
    <text x="450" y="158" font-family="'Georgia', 'Times New Roman', serif"
          font-size="88" font-weight="300" fill="url(#sage)"
          text-anchor="middle" font-style="italic">Serene</text>

    <!-- Tagline -->
    <text x="450" y="196" font-family="'Arial', sans-serif" font-size="14.5"
          fill="#F5F0E8" opacity="0.42" text-anchor="middle" letter-spacing="2"
          font-weight="300">Share freely. Scroll less. Feel better.</text>

    <!-- Stats divider -->
    <line x1="280" y1="218" x2="620" y2="218" stroke="white" stroke-width="0.5" opacity="0.08"/>

    <!-- Stats row -->
    <!-- Stat 1 -->
    <text x="330" y="242" font-family="'Georgia', serif" font-size="24"
          fill="url(#sage)" text-anchor="middle" font-weight="300">30</text>
    <text x="330" y="258" font-family="'Arial', sans-serif" font-size="8.5"
          fill="#F5F0E8" text-anchor="middle" opacity="0.22" letter-spacing="2">POSTS / DAY MAX</text>

    <!-- Divider -->
    <line x1="390" y1="230" x2="390" y2="255" stroke="white" stroke-width="0.5" opacity="0.1"/>

    <!-- Stat 2 -->
    <text x="450" y="242" font-family="'Georgia', serif" font-size="24"
          fill="url(#sage)" text-anchor="middle" font-weight="300">0</text>
    <text x="450" y="258" font-family="'Arial', sans-serif" font-size="8.5"
          fill="#F5F0E8" text-anchor="middle" opacity="0.22" letter-spacing="2">PUBLIC LIKE COUNTS</text>

    <!-- Divider -->
    <line x1="510" y1="230" x2="510" y2="255" stroke="white" stroke-width="0.5" opacity="0.1"/>

    <!-- Stat 3 -->
    <text x="570" y="242" font-family="'Georgia', serif" font-size="24"
          fill="url(#sage)" text-anchor="middle" font-weight="300"></text>
    <text x="570" y="258" font-family="'Arial', sans-serif" font-size="8.5"
          fill="#F5F0E8" text-anchor="middle" opacity="0.22" letter-spacing="2">CALMER SCROLLING</text>

    <!-- Bottom URL -->
    <text x="450" y="275" font-family="'Arial', sans-serif" font-size="10"
          fill="#8ABD80" opacity="0.35" text-anchor="middle" letter-spacing="1.5">serene.network</text>
  </g>
</svg>
